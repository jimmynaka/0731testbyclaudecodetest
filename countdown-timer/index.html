<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ポーンタイマー</title>
    <meta
      name="description"
      content="4秒、8秒、4秒など自由に設定できる、ポーン音つきカウントダウンタイマー。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="timer-panel" aria-labelledby="app-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">Countdown Chime Timer</p>
            <h1 id="app-title">ポーンタイマー</h1>
          </div>
          <button id="sound-test" class="icon-button" type="button" aria-label="音を試す" title="音を試す">
            ♪
          </button>
        </div>

        <div class="timer-face" aria-live="polite">
          <svg class="progress-ring" viewBox="0 0 220 220" role="img" aria-label="現在の残り時間">
            <circle class="ring-track" cx="110" cy="110" r="96"></circle>
            <circle id="ring-progress" class="ring-progress" cx="110" cy="110" r="96"></circle>
          </svg>
          <div class="time-readout">
            <span id="phase-label" class="phase-label">準備中</span>
            <span id="time-left" class="time-left">00:04</span>
            <span id="round-label" class="round-label">1 / 3 セット</span>
          </div>
        </div>

        <div class="controls" aria-label="タイマー操作">
          <button id="start-pause" class="primary-button" type="button">開始</button>
          <button id="reset" class="secondary-button" type="button">リセット</button>
        </div>
      </section>

      <section class="settings-panel" aria-labelledby="settings-title">
        <div class="section-heading">
          <h2 id="settings-title">設定</h2>
          <button id="add-phase" class="small-button" type="button">+ 区間</button>
        </div>

        <div id="phase-list" class="phase-list" aria-label="音が鳴る間隔"></div>

        <label class="field">
          <span>繰り返し回数</span>
          <input id="rounds" type="number" min="1" max="99" step="1" value="3" inputmode="numeric" />
        </label>

        <label class="toggle-row">
          <input id="auto-repeat" type="checkbox" />
          <span>止めるまで繰り返す</span>
        </label>

        <div class="tone-settings">
          <label class="field">
            <span>音色</span>
            <select id="tone-style">
              <option value="cute" selected>きらきら</option>
              <option value="soft">やわらかいポーン</option>
              <option value="wood">木琴</option>
            </select>
          </label>
          <label class="field">
            <span>音の高さ</span>
            <input id="tone-pitch" type="range" min="320" max="980" step="10" value="720" />
          </label>
          <label class="field">
            <span>音量</span>
            <input id="tone-volume" type="range" min="0" max="100" step="1" value="65" />
          </label>
        </div>
      </section>
    </main>

    <template id="phase-row-template">
      <div class="phase-row">
        <span class="phase-number"></span>
        <label>
          <span>秒</span>
          <input class="phase-seconds" type="number" min="1" max="999" step="1" inputmode="numeric" />
        </label>
        <button class="remove-phase" type="button" aria-label="区間を削除" title="区間を削除">×</button>
      </div>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
